services:
  nginx:
    container_name: nginx
    build: ./requirements/nginx
    depends_on:
      - wordpress
    ports:	# host:container
      - ${NGINX_PORT}:443
    volumes:
      - wordpress_data:/var/www/html:ro
    restart: always
    networks:
      - network

  mariadb:
    container_name: mariadb
    build: ./requirements/mariadb
    secrets:
      - db_root_password
      - db_user_password
    env_file:
      - .env
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
    volumes:
      - mariadb_data:/var/lib/mysql
    restart: always
    networks:
      - network

  wordpress:
    container_name: wordpress
    build: ./requirements/wordpress
    secrets:
      - db_user_password
      - wp_admin_password
      - wp_user_password
    depends_on:
      - mariadb
    env_file:
      - .env
    environment:
      WORDPRESS_DB_HOST: ${DB_HOST}
      WORDPRESS_DB_NAME: ${DB_NAME}
      WORDPRESS_DB_USER: ${DB_USER}
    volumes:
      - wordpress_data:/var/www/html
    restart: always
    networks:
      - network

# Named volumes for persistent data storage
volumes:
  mariadb_data:
    driver: local
    driver_opts:
      type: none
      device: /home/nmattos-/data/mariadb	# Store on host machine according to subject
      o: bind
  wordpress_data:
    driver: local
    driver_opts:
      type: none
      device: /home/nmattos-/data/wordpress	# Store on host machine according to subject
      o: bind

# Information too sensitive for .env file
secrets:
  db_root_password:
    file: ../secrets/db_root_password.txt
  db_user_password:
    file: ../secrets/db_password.txt
  wp_admin_password:
    file: ../secrets/wp_admin_password.txt
  wp_user_password:
    file: ../secrets/wp_user_password.txt

networks:
  network:
    driver: bridge
